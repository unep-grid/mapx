<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Examples</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
    <style>
      .input-group {
        padding: 5px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 2px 0;
      }
      .legend-swatch {
        width: 18px;
        height: 14px;
        border: 1px solid #999;
        flex: none;
      }
      pre {
        max-height: 200px;
        overflow: auto;
        background: #fff;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <h1>Render a legend from structured data</h1>
    <h3>( vector views and GeoServer raster views )</h3>
    <div class="container">
      <div class="pane-left item">
        <div class="input-group">
          <label for="selectView">View</label>
          <select id="selectView" disabled></select>
        </div>
        <div class="input-group">
          <p>
            Provider :
            <span id="resProvider">-</span>
          </p>
          <div id="legend"></div>
        </div>
        <details>
          <summary>Raw result</summary>
          <pre id="resJson"></pre>
        </details>
      </div>
      <div id="mapx" class="mapx pane-right item"></div>
    </div>
    <p>
      Source
      <a href="index.js" target="_blank">>></a>
    </p>
    <p>
      Examples home
      <a href="/index.html">>></a>
    </p>
    <script type="module" src="index.js"></script>
  </body>
</html>
