<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Examples</title>
    <link rel="stylesheet" type="text/css" href="/style.css" />
    <style>
      .input-group {
        padding: 5px;
      }
      table {
        border-collapse: collapse;
        margin-bottom: 1em;
      }
      td,
      th {
        border: 1px solid #ccc;
        padding: 2px 6px;
        text-align: left;
      }
      .no-data {
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Inspect raster values, including no data</h1>
    <h3>( click on the map )</h3>
    <div class="container">
      <div class="pane-left item">
        <div class="input-group">
          <label for="selectView">Raster view</label>
          <select id="selectView" disabled></select>
        </div>
        <div class="input-group">
          <p>
            Clicked :
            <span id="resLngLat">-</span>
          </p>
          <div id="result"></div>
        </div>
      </div>
      <div id="mapx" class="mapx pane-right item"></div>
    </div>
    <p>
      Source
      <a href="index.js" target="_blank">>></a>
    </p>
    <p>
      Examples home
      <a href="/index.html">>></a>
    </p>
    <script type="module" src="index.js"></script>
  </body>
</html>
